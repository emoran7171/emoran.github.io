short_bio: >-
  <p>
    I am a first year Ph.D. Astronomy student at The Ohio State University, primarily interested in observational and computational exoplanet studies. In particular, I am interested in studying the compositions of exoplanets and their host stars, especially by utilizing machine learning methods.
  </p>
  <p>
    - I am actively planning a new project in this area, so please check back in late autumn of 2027 for an update regarding my current work!
  </p>
  <p>
    My primary previous work at The University of Pittsburgh with Jeff Newman & Brett Andrews centered on Machine Learning Photometric Redshift (photo-z) Estimation. My work primarily focused on improving our understanding of deep learning photo-z estimation algorithms (such as [link encap here]) through analysis of their outputs. Our results were published in <a href="https://iopscience.iop.org/article/10.3847/1538-4357/ae2ace">Moran et al 2026</a>.
  </p>

