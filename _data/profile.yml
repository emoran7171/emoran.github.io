short_bio: >-
  <p>
    I am a first year Astronomy Ph.D. student at The Ohio State University. I am primarily interested in exoplanets— in particular, my interest lies in studying the compositions of exoplanets and their host stars, especially by utilizing machine learning methods.
  </p>
  <p>
    I am actively planning a new project concerning spectral emulators for planetary host M dwarfs, so please check back in late autumn of 2027 for updates regarding my current work!
  </p>
  <p>
    Beyond research, I am very passionate about outreach and science communications, especially targeting my home region of northern Appalachia. In my spare time, I enjoy fiction writing, reading (currently reading The Count of Monte Cristo & Katabasis), and fashion design. 
  </p>

